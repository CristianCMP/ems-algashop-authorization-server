spring:
  security:
    user:
      name: customer@test.com
      password: 123456
    oauth2:
      authorizationserver:
        issuer: http://algashop-authorization-server:8081
        client:
          algashop-test-client:
            registration:
              client-id: algashop-test
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}testing123"
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - invoices:write
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
            token:
              access-token-time-to-live: 15m
#              access-token-format: reference # Opaque
              access-token-format: self-contained # JWT - Is default
          algashop-ordering-service-client:
            registration:
              client-id: algashop-ordering-service
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}secret123"
              scopes:
                - products:read
            token:
              access-token-time-to-live: 5m
              access-token-format: self-contained # JWT - Is default
      algashop-ecommerce-web-client:
        registration:
          client_id: algashop-ecommerce-web
          client_secret: "{noop}ecommerce123"
          client_name: AlgaShop Ecommerce # not using for spring
          authorization-grant-types:
            - authorization_code
          client-authentication-methods:
            - client_secret_basic
          redirect-uris:
            - http://algashop-ecommerce:9080/login/oauth2/code/algashop-ecommerce-web
          scopes:
            - credit-cards:read
            - credit-cards:write
            - orders:read
            - orders:write
            - customers:read
            - customers:write
            - shopping-carts:read
            - shopping-carts:write
        require-authorization-consent: true
        require-proof-key: false #PKCE
        token:
          access-token-time-to-live: 5m
          authorization-code-time-to-live: 10m
      algashop-ecommerce-m2n-client:
        registration:
          client_id: algashop-ecommerce-m2m
          authorization-grant-types:
            - client_credentials
          client-authentication-methods:
            - client_secret_basic
          client-secret: "{noop}m2m123"
          scopes:
            - products:read
            - categories:read
            - customers:write
        token:
          access-token-time-to-live: 15m