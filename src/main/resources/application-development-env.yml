spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/authorization-server/database?prefix=auth.secrets.datasource. # ${auth.secrets.datasource.password}
      - aws-secretsmanager:/config/algashop/authorization-server/rsa-key?prefix=jwk.
      - aws-parameterstore:/config/algashop/authorization-server?prefix=auth.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
      credentials:
        access-key: test
        secret-key: test
  mail:
    host: localhost
    port: 1025
  session:
    store-type: jdbc
    timeout: 30m
  datasource:
    url: ${auth.params.datasource.url}
#    url: jdbc:postgresql://localhost:5432/authorization_server
    username: ${auth.secrets.datasource.username}
    password: ${auth.secrets.datasource.password}
  jpa:
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/testdata
    user: postgres
    password: postgres
    url: ${auth.params.datasource.url}
#    url: jdbc:postgresql://localhost:5432/authorization_server
  security:
#    user:
#      name: customer@gmail.com
#      password: 123456
    oauth2:
      authorizationserver:
#        issuer: http://auth.algashop.local:8081
#        issuer: http://auth.algashop.local:8081
#        issuer: ${auth.params.issuer}
        issuer: ${shared.params.auth-server-url}
        client:
          algashop-test-client:
            registration:
              client-id: algashop-test
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
#              client-secret: "{noop}testing123"
              client-secret: ${auth.params.clients.algashop-test.secret}
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - invoices:write
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - users:read
                - users:write
            token:
              access-token-time-to-live: 15m
#              access-token-format: reference # Opaque
              access-token-format: self-contained # JWT - Is default
          algashop-ordering-service-client:
            registration:
              client-id: algashop-ordering-service
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}secret123"
              scopes:
                - products:read
            token:
              access-token-time-to-live: 5m
              access-token-format: self-contained # JWT - Is default
          algashop-ecommerce-web-client:
            registration:
              client-id: algashop-ecommerce-web
              client-secret: "{noop}ecommerce123"
              client-name: AlgaShop Ecommerce  # not using for spring
              authorization-grant-types:
                - authorization_code
                - refresh_token
              client-authentication-methods:
                - client_secret_basic
              redirect-uris: ${auth.params.clients.algashop-ecommerce-web.redirect-uris}
#                - http://algashop-ecommerce:9080/login/oauth2/code/algashop-ecommerce-web
#                - http://algashop.local:9080/login/oauth2/code/algashop-ecommerce-web
#                - https://oauth.pstmn.io/v1/callback
              post-logout-redirect-uris:
                - http://algashop.local:9080?logout-success
              scopes:
                - credit-cards:read
                - credit-cards:write
                - orders:read
                - orders:write
                - customers:read
                - customers:write
                - shopping-carts:read
                - shopping-carts:write
                - openid
            require-authorization-consent: true
            require-proof-key: false #PKCE
            token:
              access-token-time-to-live: 5m
              authorization-code-time-to-live: 10m
              refresh-token-time-to-live: 1h
              reuse-refresh-tokens: false
          algashop-ecommerce-m2m-client:
            registration:
              client-id: algashop-ecommerce-m2m
              authorization-grant-types:
                - client_credentials
              client-authentication-methods:
                - client_secret_basic
              client-secret: "{noop}m2m123"
              scopes:
                - products:read
                - categories:read
                - users:write
                - shipping-costs:preview
            token:
              access-token-time-to-live: 15m
          algashop-admin-web-client:
            registration:
              client-id: algashop-admin-web
              client-name: AlgaShop Admin
              authorization-grant-types:
                - authorization_code
              client-authentication-methods:
                - none # Public client without authentication
              redirect-uris:
#                - http://algashop-admin:4200
#                - http://algashop-admin:4200/silent-refresh.html
                - http://admin.algashop.local:4200
                - http://admin.algashop.local:4200/silent-refresh.html
                - https://oauth.pstmn.io/v1/callback
              post-logout-redirect-uris:
#                - http://algashop-admin:4200
                - http://admin.algashop.local:4200
              scopes:
                - products:read
                - products:write
                - products:stock:write
                - categories:read
                - categories:write
                - invoices:read
                - orders:read
                - customers:read
                - shopping-carts:read
                - users:read
                - users:write
                - openid
            require-authorization-consent: false
            require-proof-key: true #PKCE
            token:
              access-token-time-to-live: 5m
              authorization-code-time-to-live: 2m

algashop:
  user-account:
    token:
      activation-ttl: PT24H
      password-reset-ttl: PT2H
    mail:
      from: AlgaShop <no-reply@algashop.com>
      password-change-url: http://auth.algashop.local:8081/change-password
  security:
    default-redirect-uri: http://algashop.local:9080
    cors:
      allowed-origins:
        - http://admin.algashop.local:4200
    cookie:
      secure: false # HTTPS
      same-site: Lax # None, Lax, Strict
      domain-name: algashop.local
    csp:
      policy-directives: frame-ancestor 'self' http://admin.algashop.local:4200 http://auth.algashop.local:8081


logging:
  level:
    org.springframework.security: TRACE

management:
  info:
    env.enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,env
  endpoint:
    health:
      show-details: always
    env:
      show-values: always