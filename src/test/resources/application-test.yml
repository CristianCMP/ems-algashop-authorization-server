spring:
  application:
    name: authorization_server
  datasource:
    url: jdbc:postgresql://localhost:5432/authorization_server_test
    username: postgres
    password: postgres
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      connection-timeout: 3000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/clean
    user: postgres
    password: postgres
    url: jdbc:postgresql://localhost:5432/authorization_server_test

algashop:
  user-account:
    token:
      activation-ttl: PT24H
      password-reset-ttl: PT2H
    mail:
      from: AlgaShop <no-reply@algashop.com>
      password-change-url: http://auth.algashop.local:8081/change-password
  security:
    defaultRedirectUri: http://localhost:9080
    cors:
      allowedOrigins:
        - http://admin.algashop.local:4200
    cookie:
      secure: false # HTTPS
      sameSite: Lax # None, Lax, Strict
      domainName: algashop.local
    csp:
      policyDirectives: frame-ancestors 'self' http://admin.algashop.local:4200 http://auth.algashop.local:8081